<!DOCTYPE html>
<html lang="en">
<!-- wwwroot/index.html -->
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CandyDataEditor</title>
    <base href="/" />

    <!-- Core App & Theme Styles -->
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="CandyDataEditor.styles.css" />
    <link rel="stylesheet" href="css/dark-mode.css" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Theme State Inline Handler -->
    <script>
        window.setDarkMode = function (isDark) {
            document.documentElement.setAttribute('data-bs-theme', isDark ? 'dark' : 'light');
        };
    </script>

    <!-- Global Utilities & TipTap Core Bundle -->
    <script src="js/tiptap-bundle.min.js"></script>
</head>

<body>
    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script type="module" src="js/tiptap-interop.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
